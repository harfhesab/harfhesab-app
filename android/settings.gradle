pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'project'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// به دلیل تداخل دو پیکیج بازار و مایکت، سیستم Autolinking را برای این دو پکیج غیر فعال میکنیم.
include ':react-native-poolakey'
project(':react-native-poolakey').projectDir = new File(rootProject.projectDir, '../node_modules/@cafebazaar/react-native-poolakey/android')

include ':iab-myket-reactnative'
project(':iab-myket-reactnative').projectDir = new File(rootProject.projectDir, '../node_modules/iab-myket-reactnative/android')